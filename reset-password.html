<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новый пароль — Smart Dating Europe</title><style>*{box-sizing:border-box}body{background:#0b0b0d;color:#f5ecd5;font:16px system-ui;margin:0}main{max-width:760px;margin:30px auto;padding:22px}h1,h2{color:#efd18a}a{color:#efd18a}.panel{border:1px solid #75603a;background:#191715;border-radius:16px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.gift{background:#27221a;border:1px solid #9e8249;border-radius:14px;padding:14px;color:#f5ecd5;cursor:pointer}.gift:disabled{opacity:.5}button{background:#e8c573;color:#16110a;padding:12px;border:0;border-radius:10px;cursor:pointer}button:disabled{opacity:.5}input{padding:12px;border-radius:8px;background:#131313;color:white;border:1px solid #806a3d;width:100%}small,.muted{color:#b8b0a2}#status{white-space:pre-wrap}</style></head><body><main><a href="index.html">← На главную</a><h1>Восстановление пароля</h1><div class="panel"><form id="f"><label>Новый пароль (не менее 8 символов)<input id="password" type="password" minlength="8" autocomplete="new-password" required></label><p><label>Повторите пароль<input id="repeat" type="password" minlength="8" autocomplete="new-password" required></label></p><button type="submit">Сохранить новый пароль</button></form><p id="status" role="status">Откройте эту страницу по ссылке из письма.</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://lhxdfwgldecmilxaqpcp.supabase.co','sb_publishable_vktrlV800QX2YQ7Bqj5-lw_xcH5bT48');let recovery=false;const status=document.getElementById('status');db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovery=true;status.textContent='Введите новый пароль.'}});document.getElementById('f').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('password').value;if(p!==document.getElementById('repeat').value){status.textContent='Пароли не совпадают.';return}const {data}=await db.auth.getSession();if(!data.session){status.textContent='Ссылка недействительна или истекла. Запросите новое письмо на главной странице.';return}const {error}=await db.auth.updateUser({password:p});status.textContent=error?'Ошибка: '+error.message:'Пароль изменён. Теперь можно войти на главной странице.';if(!error)await db.auth.signOut();};</script></body></html>
