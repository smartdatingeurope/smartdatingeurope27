function tr(key){return T[language.value][key]||T.en[key]||key}
function applyLanguage(code){language.value=T[code]?code:'en';document.documentElement.lang=language.value;document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=tr(el.dataset.i)});document.querySelectorAll('[data-placeholder]').forEach(el=>{el.placeholder=tr(el.dataset.placeholder)});document.querySelectorAll('[data-aria]').forEach(el=>{el.setAttribute('aria-label',tr(el.dataset.aria))});updateAuth();if(document.getElementById('authStatus').dataset.shown==='yes')document.getElementById('authStatus').textContent=tr('authStatus')}

document.getElementById('authForm').onsubmit=async e=>{
 e.preventDefault();
 const status=document.getElementById('authStatus');
 const submit=document.getElementById('authSubmit');
 status.dataset.shown='yes'; status.textContent='Please wait…'; if(!db){status.textContent='Сервис входа временно недоступен.';return;} submit.disabled=true;
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 try {
   let result;
   if(mode==='register') {
     result=await db.auth.signUp({email,password});
     if(!result.error && !result.data.session) {
       status.textContent='Account created. Check your email to confirm your address, then sign in.';
     } else if(!result.error) {
       status.textContent='Account created and signed in.';
       modal.classList.remove('open');
     }
   } else {
     result=await db.auth.signInWithPassword({email,password});
     if(!result.error) {
       status.textContent='Signed in successfully.';
       modal.classList.remove('open');
       document.getElementById('openAuth').textContent='Sign out';
     }
   }
   if(result.error) status.textContent=result.error.message;
 } catch(err) { status.textContent='Connection error: '+err.message; }
 finally { submit.disabled=false; }
};
document.getElementById('openAuth').addEventListener('click',async()=>{
 if(!db){showAuth('login');document.getElementById('authStatus').textContent='Сервис входа временно недоступен. Попробуйте позже.';return;}
 const {data}=await db.auth.getSession();
 if(data.session) {
   await db.auth.signOut();

 } else showAuth('login');
});
function showProfileMessage(message){
 const root=document.getElementById('profiles');
 root.replaceChildren();
 const p=document.createElement('p');
 p.className='sub'; p.textContent=message; root.appendChild(p);
}
const profileModal=document.getElementById('profileModal');
function openMemberProfile(profile){
 document.getElementById('profileTitle').textContent=profile.username||'Member';
 document.getElementById('profileLocation').textContent=[profile.city,profile.country].filter(Boolean).join(' · ')||'Europe';
 document.getElementById('profileBio').textContent=profile.bio||'Описание пока не добавлено.';
 const messageLink=document.getElementById('messageMember');
 const validId=typeof profile.id==='string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(profile.id);
 messageLink.href=validId?'chat.html?to='+encodeURIComponent(profile.id):'#';
 messageLink.style.display=validId?'inline-block':'none';
 profileModal.classList.add('open');
 document.getElementById('closeProfile').focus();
}
document.getElementById('closeProfile').onclick=()=>profileModal.classList.remove('open');
profileModal.addEventListener('click',e=>{if(e.target===profileModal)profileModal.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')profileModal.classList.remove('open')});
function renderProfiles(rows){
 const root=document.getElementById('profiles');
 root.replaceChildren();
 if(!rows || rows.length===0){showProfileMessage(tr('noProfiles'));return;}
 rows.forEach(profile=>{
   const card=document.createElement('article'); card.className='card';
   const portrait=document.createElement('div'); portrait.className='portrait'; portrait.textContent='♡';
   const body=document.createElement('div'); body.className='cardbody';
   const name=document.createElement('h3'); name.textContent=profile.username || 'Member';
   const meta=document.createElement('div'); meta.className='meta';
   meta.textContent=[profile.city,profile.country].filter(Boolean).join(' · ') || 'Europe';
   const bio=document.createElement('p'); bio.textContent=profile.bio || '';
   body.append(name,meta,bio); card.append(portrait,body);
   card.tabIndex=0; card.setAttribute('role','button'); card.setAttribute('aria-label','Открыть анкету: '+(profile.username||'Member'));
   card.style.cursor='pointer';
   const open=()=>openMemberProfile(profile);
   card.addEventListener('click',open);
   card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
   root.appendChild(card);
 });
}

 const country=document.getElementById('country').value.trim();
 const city=document.getElementById('city').value.trim();
 if(country) query=query.ilike('country','%'+country+'%');
 if(city) query=query.ilike('city','%'+city+'%');
 const {data,error}=await query;
 if(error){console.error('Supabase profiles:',error);showProfileMessage(tr('profilesError'));return;}
 renderProfiles(data);
}
document.getElementById('filterBtn').onclick=()=>{loadProfiles();document.getElementById('people').scrollIntoView({behavior:'smooth'});};
document.getElementById('country').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();loadProfiles();}});
document.getElementById('city').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();loadProfiles();}});
if(db) db.auth.onAuthStateChange((_event,session)=>{
 if(session) document.getElementById('openAuth').textContent='Sign out';
 else document.getElementById('openAuth').textContent=tr('login');
});
applyLanguage('ru');
loadProfiles();
</script></body></html>
